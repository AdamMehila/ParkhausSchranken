; ===========================================================================
; PlatformIO Project Configuration File
;
; Parksystem mit Schranke, Modul M450
;
; Diese Datei sagt PlatformIO, wofuer gebaut werden soll und mit welchen
; Einstellungen. Ein Strichpunkt am Zeilenanfang macht eine Kommentarzeile.
;
; Aus diesem einen Projekt entstehen ZWEI verschiedene Firmwares, eine pro
; Pico. Jede davon hat hier unten einen eigenen Abschnitt:
;
;   pico1_cashdesk   die Kasse       Weboberflaeche, Parkvorgaenge, Gebuehren
;   pico2_barriers   die Schranke    Weboberflaeche, Servo
;
; Bauen und auf den Pico uebertragen:
;   pio run -e pico1_cashdesk -t upload
;   pio run -e pico2_barriers -t upload
;
; Die serielle Ausgabe mitlesen:
;   pio device monitor
; ===========================================================================


; ---------------------------------------------------------------------------
; Was "pio run" ohne weitere Angabe baut: nur die beiden echten Firmwares.
; Die Servo-Tests weiter unten baut man gezielt mit "pio run -e servo_test".
; ---------------------------------------------------------------------------
[platformio]
default_envs = pico1_cashdesk, pico2_barriers


; ---------------------------------------------------------------------------
; [env] ist der gemeinsame Abschnitt. Alles, was hier steht, gilt fuer beide
; Firmwares. So muss nichts doppelt gepflegt werden.
; ---------------------------------------------------------------------------
[env]

; Die Chipfamilie. Wir nehmen diese Quelle und nicht das offizielle Paket,
; weil nur sie den Core von earlephilhower mitbringt.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git

; Das konkrete Board. Daraus kennt PlatformIO die Groesse von Flash und RAM
; und weiss, wie der Pico geflasht wird.
board = rpipicow

; Die Programmierumgebung. Dadurch gibt es setup() und loop() sowie
; Befehle wie digitalWrite() und millis().
framework = arduino

; Die Arduino-Umsetzung fuer dieses Board. Diese Zeile ist wichtig: Nur der
; Core von earlephilhower bringt WebServer.h und Servo.h fuer den Pico W mit.
; Ohne sie findet der Compiler diese Dateien nicht.
board_build.core = earlephilhower

; Geschwindigkeit der seriellen Ausgabe. Dieselbe Zahl steht im Programm bei
; Serial.begin(115200). Stimmen die beiden nicht ueberein, erscheint im
; Monitor nur unleserlicher Zeichensalat.
monitor_speed = 115200

; Zusaetzliche Schalter fuer den Compiler.
;   -Wall                                 alle ueblichen Warnungen einschalten
;   -DPIO_FRAMEWORK_ARDUINO_ENABLE_IPV6=0 IPv6 abschalten, wir brauchen es
;                                         nicht und es spart Speicher
build_flags =
    -Wall
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_IPV6=0


; ---------------------------------------------------------------------------
; Pico 1, die Kasse
; ---------------------------------------------------------------------------
[env:pico1_cashdesk]

; build_src_filter bestimmt, welche Quelldateien in diese Firmware kommen.
; Gelesen wird von links nach rechts:
;   -<*>         zuerst alles abwaehlen
;   +<common/>   dann den gemeinsamen Ordner dazunehmen
;   +<cashdesk/> und den Ordner der Kasse
;
; Der Ordner barriers/ bleibt also draussen. Das ist kein Schoenheitsfehler,
; sondern zwingend noetig: Beide main.cpp definieren setup() und loop().
; Kaemen beide in dieselbe Firmware, wuerde der Linker abbrechen mit
; "multiple definition of setup".
build_src_filter = -<*> +<common/> +<cashdesk/>

; ${env.build_flags} uebernimmt die Schalter aus dem [env]-Abschnitt oben.
; Ohne diese Zeile wuerden sie hier ueberschrieben statt ergaenzt.
;
; TEST_BUILD=1 schaltet die Debug-Endpunkte frei, die das Testkonzept
; verlangt, also das Verschieben der Einfahrtszeit und das Loeschen aller
; Vorgaenge. Fuer eine echte Anlage setzt man den Wert auf 0, dann
; verschwinden diese Endpunkte vollstaendig aus dem Programm.
build_flags =
    ${env.build_flags}
    -DTEST_BUILD=1


; ---------------------------------------------------------------------------
; Pico 2, die Schranke
; ---------------------------------------------------------------------------
[env:pico2_barriers]
build_src_filter = -<*> +<common/> +<barriers/>
build_flags =
    ${env.build_flags}
    -DTEST_BUILD=1

; Hinweis zur Anzahl Servos: Standardmaessig laeuft die Firmware mit EINEM
; Servo an GP8 (Pin 11), der Ein- und Ausfahrt gemeinsam bedient. Wer zwei Servos
; anschliesst, ergaenzt hier einfach die Zeile
;     -DSERVO_COUNT=2
; oder aendert den Wert direkt in src/common/config.h.


; ---------------------------------------------------------------------------
; Servo-Test, ein eigenes kleines Prüfprogramm ohne Kasse, WLAN und Webseite.
; Es fährt den Arm jede Sekunde hin und her. Damit prüft man die Verkabelung.
; Danach die richtige Firmware wieder aufspielen.
;
;   pio run -e servo_test             Signal nur auf den Servo-Pin aus config.h (GP8, Pin 11)
;   pio run -e servo_test_all_pins    Signal auf allen Pins gleichzeitig
; ---------------------------------------------------------------------------
[env:servo_test]
build_src_filter = -<*> +<servo_test/>

[env:servo_test_all_pins]
build_src_filter = -<*> +<servo_test/>
build_flags =
    ${env.build_flags}
    -DSERVO_TEST_ALL_PINS=1
